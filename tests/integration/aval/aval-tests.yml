variables:
  AVAL_TEST_ALL:
    value: false
    description: "Whether to test all machines using AVAL"
  AVAL_DISABLED:
    value: false
    description: "Whether to disable the AVAL jobs in the pipeline."
  AVAL_ALLOW_FAILURE:
    value: false
    description: "Whether to allow the pipeline to continue upon failures in AVAL jobs."

# Build the AVAL container with docker that will run the tests on the host PC
build-aval-docker:
  tags:
    - saas-linux-small-amd64
  stage: build
  rules:
    - if: '$AVAL_DISABLED =~ /^true$/i'
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: '$AVAL_ALLOW_FAILURE =~ /^true$/i'
      when: on_success
      allow_failure: true
    - when: on_success
  variables:
    IMAGE_NAME_AVAL: aval-docker
    DOCKERFILE_NAME: tests/integration/aval/aval-docker.Dockerfile
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker login -u "${CI_DOCKER_HUB_PULL_USER}" -p "${CI_DOCKER_HUB_PULL_PASSWORD}"
  script:
    - ${B} docker build --build-arg CI_REGISTRY="${CI_REGISTRY}"
                        --build-arg CI_PROJECT_NAMESPACE="${CI_PROJECT_NAMESPACE}"
                        -f "${DOCKERFILE_NAME}"
                        -t "${CI_REGISTRY_IMAGE}/${IMAGE_NAME_AVAL}:${GITLAB_DOCKERREGISTRY_SUFFIX}" .
    - ${B} docker push "${CI_REGISTRY_IMAGE}/${IMAGE_NAME_AVAL}:${GITLAB_DOCKERREGISTRY_SUFFIX}"

.aval-template:
  stage: test
  variables:
    IMAGE_NAME: torizoncore-builder-amd64
    IMAGE_NAME_AVAL: aval-docker
  image: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME_AVAL}:${GITLAB_DOCKERREGISTRY_SUFFIX}
  script:
    # pull latest build of TorizonCore Builder
    - echo -e "\e[0Ksection_start:$(date +%s):pull_eval_tcb_section\r\e[0KPull TorizonCore Builder to be evaluated"
    - ${T} docker login -u "${CI_DOCKER_HUB_PULL_USER}" -p "${CI_DOCKER_HUB_PULL_PASSWORD}"
    - ${T} docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - ${T} docker pull "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${GITLAB_DOCKERREGISTRY_SUFFIX_LATEST}"
    - echo -e "\e[0Ksection_end:$(date +%s):pull_eval_tcb_section\r\e[0K"
    # To circumvent the mismatch between Aktualizr's database and ostree when an external entity manages ostree without
    # Aktualizr, delete the database files, which forces Aktualizr to create database again, this time synced with ostree
    - cd tests/integration && python /aval/main.py --delegation-config $DELEGATION_CONFIG --ignore-different-secondaries-between-updates
      --remove-databases --run-before-on-host "./run_all.sh --device --machine $TCB_MACHINE --report --tcb-tags requires-device
      --tcb-custom-image ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${GITLAB_DOCKERREGISTRY_SUFFIX_LATEST}"
  artifacts:
    when: always
    reports:
      junit: tests/integration/workdir/reports/report-${CI_JOB_NAME}.xml
    paths:
      - tests/integration/workdir/reports/report-${CI_JOB_NAME}.xml

.aval-template-linux-default-machines:
  extends: .aval-template
  tags:
    - all
  rules:
    - if: '$AVAL_DISABLED =~ /^true$/i'
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: '$AVAL_ALLOW_FAILURE =~ /^true$/i'
      when: on_success
      allow_failure: true
    - when: on_success

.aval-template-linux-all-machines:
  extends: .aval-template
  tags:
    - all
  rules:
    - if: '$AVAL_DISABLED =~ /^true$/i'
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: '$AVAL_TEST_ALL !~ /^true$/i'
      when: never
    - if: '$AVAL_ALLOW_FAILURE =~ /^true$/i'
      when: on_success
      allow_failure: true
    - when: on_success

.aval-template-wsl:
  extends: .aval-template
  tags:
    - windows-wsl
  rules:
    - if: '$AVAL_DISABLED =~ /^true$/i'
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: '$AVAL_ALLOW_FAILURE =~ /^true$/i'
      when: on_success
      allow_failure: true
    - when: on_success

